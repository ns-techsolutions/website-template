# Reverse proxy for the multi-tenant salon platform.
#
# The app resolves which salon to serve from the request Host header, so nginx
# only needs to (a) accept each domain and (b) forward Host / X-Forwarded-Host
# unchanged. TLS is handled upstream (Cloudflare / load balancer); this listens
# on plain HTTP :80.
#
# Add a salon: `make new-tenant …` renders docker/nginx/conf.d/tenant-<slug>.conf
# from docker/nginx/tenant.conf.template and reloads nginx. All conf.d/*.conf are
# included automatically. See docs/adding-a-tenant.md.

upstream app {
    server app:3000;
    keepalive 32;
}

# Shared proxy settings. Forwarding Host + X-Forwarded-Host verbatim is what lets
# getTenantDb() (lib/db/tenant.ts) map the request to the right salon database.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# --- Real visitor IP behind Cloudflare ----------------------------------------
# Uncomment and keep the CIDR list current (https://www.cloudflare.com/ips/)
# so logs/rate-limits see the client IP instead of Cloudflare's edge.
#   real_ip_header CF-Connecting-IP;
#   set_real_ip_from 173.245.48.0/20;
#   set_real_ip_from 103.21.244.0/22;
#   ... (full list) ...

# --- Platform / master console -------------------------------------------------
server {
    listen 80;
    server_name admin.localhost;   # = PLATFORM_HOST

    client_max_body_size 25m;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# --- Salons --------------------------------------------------------------------
# Each salon is a separate docker/nginx/conf.d/tenant-<slug>.conf file, generated
# by `make new-tenant`. They are included here automatically by nginx.

# --- Catch-all: reject unknown hosts -------------------------------------------
# Drops the connection (444) for any Host that isn't an explicit salon/platform
# block above. Defense in depth; keep it last.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
