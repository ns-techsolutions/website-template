# Per-salon reverse-proxy block. NOT loaded directly (it lives outside conf.d).
# `make new-tenant` substitutes salon.local and writes the result to
# docker/nginx/conf.d/tenant-<slug>.conf, which nginx then includes.
#
# Mirrors the platform block's proxy settings in conf.d/sma.conf — `app` upstream
# and the `$forwarded_proto` map are defined there.
server {
    listen 80;
    server_name salon.local;

    client_max_body_size 25m;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
